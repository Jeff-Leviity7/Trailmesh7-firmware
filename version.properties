[VERSION]
major = 2
minor = 8
build = 0
; TrailMesh fork marker, stamped into the long version between the release
; number and the commit sha: 2.8.0.tm7d977d5a. The app looks for it to tell a
; TrailMesh tag from one running stock firmware.
;
; Placed before the sha on purpose. DeviceMetadata.firmware_version is an
; 18-byte buffer filled with strncpy, so a long version clips the tail — with
; the marker first, a clipped string still identifies itself.
;
; Not part of `short`, which feeds APP_VERSION_SHORT and every version
; comparison. This must not affect whether an update looks newer.
fork = tm7
build = 2
